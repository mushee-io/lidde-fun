name: Quest contracts
on:
  push:
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - '.github/workflows/quests-contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'foundry.toml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Compile contracts
        run: forge build --sizes
      - name: Run quest contract tests
        run: forge test -vv
