name: Dependency security audit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install only for dependency lock resolution
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high
